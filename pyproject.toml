[project]
name = "inventory-ai-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Pau Vilardell", email = "pauetisdev@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.142.2",
    "langchain>=1.4.3",
    "langchain-mcp-adapters>=0.3.2",
    "langchain-openai>=1.6.7",
    "motor>=3.7.1",
    "pydantic-settings>=2.15.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
inventory-ai-agent = "inventory_ai_agent:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package = false
